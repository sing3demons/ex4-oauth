version: '3.8'

services:
  auth-server:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - HOST=0.0.0.0
      - ENV=production
      - DATABASE_URL=/app/data/auth.db
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-this-in-production-with-at-least-32-characters}
      - ACCESS_TOKEN_TTL=15m
      - REFRESH_TOKEN_TTL=168h
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - OAUTH_REDIRECT_URL=${OAUTH_REDIRECT_URL:-http://localhost:8080/api/auth/oauth/google/callback}
      - BCRYPT_COST=12
      - RATE_LIMIT_PER_MIN=60
      - ALLOWED_ORIGIN_1=${ALLOWED_ORIGIN_1:-http://localhost:3000}
      - ALLOWED_ORIGIN_2=${ALLOWED_ORIGIN_2:-http://localhost:3001}
    volumes:
      - auth_data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add nginx reverse proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro  # Add your SSL certificates here
    depends_on:
      - auth-server
    restart: unless-stopped
    profiles:
      - nginx

volumes:
  auth_data:
    driver: local